# Documentation System hooks for this project.
# Set a hook to off to disable it here; DOCSYS_HOOKS=off disables all of them
# for one shell. Hooks not listed here are on.

# Short briefing at the start of every session, including after /clear
briefing=on

# At the end of a turn, ask the agent to update your session doc if code
# changed after it (at most every DOCSYS_NUDGE_MINUTES, default 10)
progress=on

# When code changes on a branch with no session doc of yours, ask the agent
# to create one and tell you in one line (at most every 30 minutes per branch)
new_session=on

# After a shell command, tell the agent if it wrote Markdown outside the
# allowed places (the Markdown guard only sees the agent's file tools)
shell_markdown=on

# On a commit or when a session is archived, ask the agent to offer moving
# the ticket to the team's final status (once Jira is set up)
tickets=on

# Before a shell command, refuse one that deploys - sam deploy, cloudformation deploy, an app
# upload: this project deploys only through CI/CD. Turning it off is a person's decision.
deploy_guard=on
